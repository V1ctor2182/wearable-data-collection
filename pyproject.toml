[project]
name = "wearable-data-pipeline"
version = "0.1.0"
description = "Raw data collection pipeline for wearable health devices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "duckdb>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "fitparse>=1.2.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wearable_pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
